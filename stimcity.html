<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a12">
<title>Stim City 🌈</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0a12; color: #fff; touch-action: none;
  }
  #app { position: fixed; inset: 0; }

  /* ---- hub ---- */
  #hub {
    position: absolute; inset: 0; overflow-y: auto; padding: 28px 20px 40px;
    background: radial-gradient(circle at 30% 10%, #1e1638, #0a0a12 70%);
  }
  #hub h1 {
    font-size: 40px; font-weight: 800; text-align: center; margin: 10px 0 4px;
    background: linear-gradient(90deg,#ff7eb6,#7afcff,#feff9c,#ff7eb6);
    background-size: 300% auto; -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; animation: shine 6s linear infinite;
  }
  @keyframes shine { to { background-position: 300% center; } }
  #hub .tag { text-align: center; color: #9a8fc0; margin-bottom: 24px; font-size: 15px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 14px; max-width: 620px; margin: 0 auto; }
  .toycard {
    border: none; border-radius: 20px; padding: 22px 16px; cursor: pointer; color: #fff;
    font-size: 17px; font-weight: 700; text-align: left; min-height: 120px;
    display: flex; flex-direction: column; justify-content: space-between;
    transition: transform .12s ease, filter .12s ease;
  }
  .toycard:active { transform: scale(.95); filter: brightness(1.15); }
  .toycard .emoji { font-size: 34px; }
  .toycard small { display: block; font-weight: 400; opacity: .85; font-size: 12px; margin-top: 2px; }

  /* ---- toy view ---- */
  #toy { position: absolute; inset: 0; display: none; }
  #toyCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #back {
    position: absolute; top: 14px; left: 14px; z-index: 5;
    background: rgba(0,0,0,.4); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.2);
    color: #fff; border-radius: 999px; padding: 10px 18px; font-size: 15px; cursor: pointer;
  }
  #toyName {
    position: absolute; top: 16px; right: 16px; z-index: 5; color: rgba(255,255,255,.55);
    font-size: 14px; letter-spacing: 1px; text-transform: uppercase;
  }
  #hint {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 5;
    color: rgba(255,255,255,.5); font-size: 14px; text-align: center; pointer-events: none;
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:.75} }
  #sound {
    position: absolute; bottom: 18px; right: 16px; z-index: 5;
    background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.2); color: #fff;
    border-radius: 999px; padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <div id="hub">
    <h1>Stim City</h1>
    <div class="tag">tap a toy · calm your brain · no rules</div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="toy">
    <canvas id="toyCanvas"></canvas>
    <button id="back">← back</button>
    <div id="toyName"></div>
    <div id="hint"></div>
    <button id="sound">🔊 sound</button>
  </div>
</div>

<script>
"use strict";

/* ===== tiny sound engine (Web Audio, generated — no files) ===== */
const Sound = {
  on: true, ctx: null,
  ensure() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this.ctx.resume(); },
  blip(freq = 440, dur = 0.12, type = "sine", vol = 0.25) {
    if (!this.on) return;
    this.ensure();
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur);
  },
  pop() { this.blip(180 + Math.random() * 120, 0.09, "triangle", 0.3); },
  drop(f) { if (!this.on) return; this.ensure(); const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.5, t + 0.3);
    g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + 0.36);
  }
};

/* ===== canvas plumbing ===== */
const canvas = document.getElementById("toyCanvas");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);

let raf = null, current = null;
const pointers = new Map();

function getPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
canvas.addEventListener("pointerdown", e => { canvas.setPointerCapture(e.pointerId); const p = getPos(e); pointers.set(e.pointerId, p); Sound.ensure(); current?.down?.(p, e.pointerId); });
canvas.addEventListener("pointermove", e => { if (!pointers.has(e.pointerId) && e.pressure === 0 && !current?.hover) { current?.move?.(getPos(e), e.pointerId, false); return; } const p = getPos(e); if (pointers.has(e.pointerId)) pointers.set(e.pointerId, p); current?.move?.(p, e.pointerId, pointers.has(e.pointerId)); });
canvas.addEventListener("pointerup", e => { current?.up?.(getPos(e), e.pointerId); pointers.delete(e.pointerId); });
canvas.addEventListener("pointercancel", e => { pointers.delete(e.pointerId); });

function rand(a, b) { return a + Math.random() * (b - a); }
function hsl(h, s, l, a = 1) { return `hsla(${h},${s}%,${l}%,${a})`; }

/* ===================================================================
   TOYS
=================================================================== */
const TOYS = {

  /* ---- bubble wrap ---- */
  bubbles: {
    name: "Bubble Wrap", emoji: "🫧", hint: "pop them all — drag to pop lots",
    color: "linear-gradient(135deg,#7afcff,#4a6cf7)",
    init() {
      this.cells = [];
      const size = Math.max(46, Math.min(W, H) / 9);
      const cols = Math.floor(W / size), rows = Math.floor(H / size);
      const ox = (W - cols * size) / 2, oy = (H - rows * size) / 2;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
        this.cells.push({ x: ox + c * size + size / 2, y: oy + r * size + size / 2, r: size * 0.42, popped: false, hue: rand(180, 260), t: 0 });
      this.size = size;
    },
    popAt(p) {
      for (const b of this.cells) {
        if (!b.popped && Math.hypot(p.x - b.x, p.y - b.y) < b.r) {
          b.popped = true; b.t = 1; Sound.pop();
          if (navigator.vibrate) navigator.vibrate(12);
          if (this.cells.every(x => x.popped)) setTimeout(() => this.init(), 500);
        }
      }
    },
    down(p) { this.popAt(p); },
    move(p, id, down) { if (down) this.popAt(p); },
    draw() {
      ctx.clearRect(0, 0, W, H);
      for (const b of this.cells) {
        if (b.popped) {
          if (b.t > 0) b.t -= 0.06;
          ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (1 - b.t * 0.5), 0, 7);
          ctx.fillStyle = hsl(b.hue, 40, 22, 0.5); ctx.fill();
        } else {
          const g = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.1, b.x, b.y, b.r);
          g.addColorStop(0, hsl(b.hue, 90, 85, 0.95));
          g.addColorStop(1, hsl(b.hue, 80, 55, 0.85));
          ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fillStyle = g; ctx.fill();
          ctx.beginPath(); ctx.arc(b.x - b.r * 0.32, b.y - b.r * 0.32, b.r * 0.18, 0, 7);
          ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.fill();
        }
      }
    }
  },

  /* ---- ripples ---- */
  ripples: {
    name: "Ripples", emoji: "💧", hint: "tap anywhere",
    color: "linear-gradient(135deg,#4a6cf7,#9b5cff)",
    init() { this.rings = []; this.hue = rand(0, 360); },
    spawn(p) { this.rings.push({ x: p.x, y: p.y, r: 4, hue: this.hue }); this.hue = (this.hue + 40) % 360; Sound.drop(rand(300, 600)); if (navigator.vibrate) navigator.vibrate(8); },
    down(p) { this.spawn(p); },
    move(p, id, down) { if (down && Math.random() < 0.3) this.spawn(p); },
    draw() {
      ctx.fillStyle = "rgba(10,10,18,.18)"; ctx.fillRect(0, 0, W, H);
      for (const r of this.rings) {
        r.r += 3.2;
        const a = Math.max(0, 1 - r.r / (Math.max(W, H) * 0.7));
        ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7);
        ctx.lineWidth = 3; ctx.strokeStyle = hsl(r.hue, 90, 65, a); ctx.stroke();
        ctx.beginPath(); ctx.arc(r.x, r.y, r.r * 0.6, 0, 7);
        ctx.strokeStyle = hsl(r.hue, 90, 75, a * 0.5); ctx.stroke();
      }
      this.rings = this.rings.filter(r => r.r < Math.max(W, H));
    }
  },

  /* ---- glowing trail ---- */
  trail: {
    name: "Neon Trail", emoji: "✨", hint: "drag your finger around",
    color: "linear-gradient(135deg,#ff7eb6,#feff9c)",
    init() { this.parts = []; this.hue = rand(0, 360); this.last = {}; },
    add(p, id) {
      const l = this.last[id];
      if (l) { const steps = Math.hypot(p.x - l.x, p.y - l.y) / 6;
        for (let i = 0; i < steps; i++) { const t = i / steps;
          this.parts.push({ x: l.x + (p.x - l.x) * t, y: l.y + (p.y - l.y) * t, r: rand(6, 16), hue: this.hue, life: 1, vy: rand(-0.4, 0.4), vx: rand(-0.4, 0.4) }); } }
      this.last[id] = p; this.hue = (this.hue + 3) % 360;
    },
    down(p, id) { this.last[id] = p; this.add(p, id); },
    move(p, id, down) { if (down) this.add(p, id); },
    up(p, id) { delete this.last[id]; },
    draw() {
      ctx.fillStyle = "rgba(10,10,18,.12)"; ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = "lighter";
      for (const s of this.parts) {
        s.life -= 0.012; s.x += s.vx; s.y += s.vy; s.r *= 0.985;
        const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
        g.addColorStop(0, hsl(s.hue, 100, 65, s.life));
        g.addColorStop(1, hsl(s.hue, 100, 55, 0));
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fillStyle = g; ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";
      this.parts = this.parts.filter(s => s.life > 0);
    }
  },

  /* ---- particle orbit that follows touch ---- */
  orbit: {
    name: "Follow", emoji: "🌀", hint: "move your finger — they chase it",
    color: "linear-gradient(135deg,#9b5cff,#7afcff)",
    init() {
      this.target = { x: W / 2, y: H / 2 };
      this.dots = [];
      for (let i = 0; i < 90; i++)
        this.dots.push({ x: rand(0, W), y: rand(0, H), vx: 0, vy: 0, hue: rand(160, 300), sz: rand(2, 6) });
    },
    down(p) { this.target = p; },
    move(p, id, down) { this.target = p; },
    draw() {
      ctx.fillStyle = "rgba(10,10,18,.2)"; ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = "lighter";
      for (const d of this.dots) {
        const dx = this.target.x - d.x, dy = this.target.y - d.y;
        const dist = Math.hypot(dx, dy) || 1;
        d.vx += (dx / dist) * 0.6; d.vy += (dy / dist) * 0.6;
        d.vx *= 0.92; d.vy *= 0.92;
        d.x += d.vx; d.y += d.vy;
        const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.sz * 3);
        g.addColorStop(0, hsl(d.hue, 90, 65, 0.9));
        g.addColorStop(1, hsl(d.hue, 90, 55, 0));
        ctx.beginPath(); ctx.arc(d.x, d.y, d.sz * 3, 0, 7); ctx.fillStyle = g; ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";
    }
  },

  /* ---- fidget spinner ---- */
  spinner: {
    name: "Spinner", emoji: "🎡", hint: "flick to spin",
    color: "linear-gradient(135deg,#feff9c,#ff7eb6)",
    init() { this.angle = 0; this.vel = 0; this.drag = null; this.prevA = 0; },
    angleTo(p) { return Math.atan2(p.y - H / 2, p.x - W / 2); },
    down(p) { this.drag = this.angleTo(p); this.prevA = this.angle; this.vel = 0; },
    move(p, id, down) { if (down && this.drag != null) { const a = this.angleTo(p); let d = a - this.drag; this.lastDelta = d; this.angle = this.prevA + d; } },
    up() { if (this.drag != null) { this.vel = (this.lastDelta || 0) * 0.9; this.drag = null; if (Math.abs(this.vel) > 0.05) Sound.blip(300, 0.1, "sawtooth", 0.15); } },
    draw() {
      ctx.clearRect(0, 0, W, H);
      if (this.drag == null) { this.angle += this.vel; this.vel *= 0.99; if (Math.abs(this.vel) < 0.001) this.vel = 0; }
      const cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.3;
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(this.angle);
      for (let i = 0; i < 3; i++) {
        ctx.rotate((Math.PI * 2) / 3);
        const g = ctx.createLinearGradient(0, 0, 0, R);
        g.addColorStop(0, hsl(200 + i * 50, 90, 60));
        g.addColorStop(1, hsl(320 + i * 30, 90, 60));
        ctx.beginPath(); ctx.arc(0, R, R * 0.32, 0, 7); ctx.fillStyle = g; ctx.fill();
        ctx.beginPath(); ctx.moveTo(-R * 0.16, 0); ctx.lineTo(R * 0.16, 0); ctx.lineTo(R * 0.28, R); ctx.lineTo(-R * 0.28, R); ctx.closePath();
        ctx.fillStyle = hsl(240, 30, 30); ctx.fill();
      }
      ctx.beginPath(); ctx.arc(0, 0, R * 0.28, 0, 7); ctx.fillStyle = "#2a2540"; ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, R * 0.16, 0, 7); ctx.fillStyle = "#4a4470"; ctx.fill();
      ctx.restore();
      const rpm = Math.abs(this.vel) * 60 / (Math.PI * 2) * 60;
      ctx.fillStyle = "rgba(255,255,255,.4)"; ctx.font = "14px -apple-system,sans-serif"; ctx.textAlign = "center";
      ctx.fillText(rpm > 1 ? Math.round(rpm) + " rpm" : "", cx, cy + R + 40);
    }
  },

  /* ---- kinetic squish blob ---- */
  squish: {
    name: "Squish", emoji: "🟣", hint: "drag the blob around & squish it",
    color: "linear-gradient(135deg,#ff7eb6,#9b5cff)",
    init() {
      this.N = 42; this.pts = []; this.cx = W / 2; this.cy = H / 2;
      this.R = Math.min(W, H) * 0.22; this.hue = rand(260, 320);
      for (let i = 0; i < this.N; i++) { const a = (i / this.N) * Math.PI * 2;
        this.pts.push({ a, r: this.R, vr: 0 }); }
      this.grab = null; this.vx = 0; this.vy = 0;
    },
    down(p) { if (Math.hypot(p.x - this.cx, p.y - this.cy) < this.R * 1.3) { this.grab = { x: p.x - this.cx, y: p.y - this.cy }; Sound.blip(220, 0.15, "sine", 0.2); if (navigator.vibrate) navigator.vibrate(10);
      // poke the nearest points inward
      const ang = Math.atan2(p.y - this.cy, p.x - this.cx);
      for (const pt of this.pts) { const d = Math.abs(((pt.a - ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI); if (d < 0.9) pt.vr -= (0.9 - d) * 26; } } },
    move(p, id, down) { if (down && this.grab) { this.tx = p.x - this.grab.x; this.ty = p.y - this.grab.y; } },
    up() { this.grab = null; },
    draw() {
      ctx.fillStyle = "rgba(10,10,18,.25)"; ctx.fillRect(0, 0, W, H);
      if (this.grab && this.tx != null) { this.vx += (this.tx - this.cx) * 0.2; this.vy += (this.ty - this.cy) * 0.2; }
      else { this.vx += (W / 2 - this.cx) * 0.01; this.vy += (H / 2 - this.cy) * 0.01; }
      this.vx *= 0.8; this.vy *= 0.8; this.cx += this.vx; this.cy += this.vy;
      for (const pt of this.pts) { pt.vr += (this.R - pt.r) * 0.08; pt.vr *= 0.86; pt.r += pt.vr; }
      // wobble neighbors
      for (let i = 0; i < this.N; i++) { const a = this.pts[i], b = this.pts[(i + 1) % this.N]; const f = (a.r - b.r) * 0.06; a.vr -= f; b.vr += f; }
      ctx.beginPath();
      for (let i = 0; i <= this.N; i++) { const pt = this.pts[i % this.N];
        const x = this.cx + Math.cos(pt.a) * pt.r, y = this.cy + Math.sin(pt.a) * pt.r;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
      ctx.closePath();
      const g = ctx.createRadialGradient(this.cx - this.R * 0.3, this.cy - this.R * 0.3, this.R * 0.1, this.cx, this.cy, this.R * 1.2);
      g.addColorStop(0, hsl(this.hue, 90, 75)); g.addColorStop(1, hsl(this.hue + 20, 85, 55));
      ctx.fillStyle = g; ctx.fill();
      ctx.beginPath(); ctx.arc(this.cx - this.R * 0.35, this.cy - this.R * 0.35, this.R * 0.18, 0, 7);
      ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.fill();
    }
  }
};

/* ===================================================================
   HUB + navigation
=================================================================== */
const grid = document.getElementById("grid");
for (const [key, toy] of Object.entries(TOYS)) {
  const b = document.createElement("button");
  b.className = "toycard";
  b.style.background = toy.color;
  b.innerHTML = `<span class="emoji">${toy.emoji}</span><span>${toy.name}<small>${toy.hint}</small></span>`;
  b.onclick = () => openToy(key);
  grid.appendChild(b);
}

function loop() { current?.draw(); raf = requestAnimationFrame(loop); }

function openToy(key) {
  current = TOYS[key];
  document.getElementById("hub").style.display = "none";
  document.getElementById("toy").style.display = "block";
  document.getElementById("toyName").textContent = current.name;
  document.getElementById("hint").textContent = current.hint;
  resize();
  current.tx = current.ty = null; current.lastDelta = 0;
  current.init();
  cancelAnimationFrame(raf); loop();
}

document.getElementById("back").onclick = () => {
  cancelAnimationFrame(raf); raf = null; current = null; pointers.clear();
  document.getElementById("toy").style.display = "none";
  document.getElementById("hub").style.display = "block";
};

document.getElementById("sound").onclick = e => {
  Sound.on = !Sound.on;
  e.target.textContent = Sound.on ? "🔊 sound" : "🔇 muted";
};
</script>
</body>
</html>
